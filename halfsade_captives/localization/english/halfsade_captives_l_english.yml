l_english:
 halfsade_captives_summon_decision:0 "Receive Exotic Captives"
 halfsade_captives_summon_decision_tooltip:0 "Merchants bring strangers from far-away lands before your [court|E]. You may keep them, set them free, or return them.
 halfsade_captives_summon_decision_desc:0 "Shady merchants from the borderlands have approached my court with a secret offer. They have brought a bound captive from a distant [culture|E], and they are eager to sell this unique outsider to me for the right price."
 halfsade_captives_summon_decision_confirm:0 "Present the Strangers"
 halfsade_captives_summon_decision_effect:0 "In #V 5 days#!, the merchants will be summoned before you to ask where in the world you wish to find strangers for your [court|E]. The farther the land, the longer they will take to return."
 
 halfsade_captives.0001.toast:0 "The Merchants Prepare the Captives"
 halfsade_captives.0001.toast_desc:0 "The merchants have heard of your interest in their merchandise. They will return in a few days."

 # --- Event 0003 ---
 halfsade_captives.0003.t:0 "Strangers from Distant Shores"
 halfsade_captives.0003.desc:0 "The merchants have returned with the captives, each from a different far-away land. They now stand before your throne, unsure of what awaits them.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge].\n#bold [halfsade_captive_2.GetFirstName]#! - [halfsade_captive_2.GetCulture.GetName] [halfsade_captive_2.GetWomanMan], age [halfsade_captive_2.GetAge].\n#bold [halfsade_captive_3.GetFirstName]#! - [halfsade_captive_3.GetCulture.GetName] [halfsade_captive_3.GetWomanMan], age [halfsade_captive_3.GetAge].\n\nThe choice of what to do with them is yours."
 halfsade_captives.0003.a:0 "Welcome all three to my [court|E]"
 halfsade_captives.0003.b:0 "Keep only one of them"
 halfsade_captives.0003.c:0 "Set them all free"
 halfsade_captives.0003.d:0 "Send them back to their captivity"
 halfsade_captives.release_tt:0 "The freed strangerswill stay at your [court|E] for now, but will ask to leave after a year unless something ties them to you."

 # --- Event 0004 ---
 halfsade_captives.0004.t:0 "Two Strangers Remain"
 halfsade_captives.0004.desc:0 "One of the strangers has been taken in. Two captives still stand before your throne, waiting on your word.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge].\n#bold [halfsade_captive_2.GetFirstName]#! - [halfsade_captive_2.GetCulture.GetName] [halfsade_captive_2.GetWomanMan], age [halfsade_captive_2.GetAge]."
 halfsade_captives.0004.a:0 "Welcome both to my [court|E]"
 halfsade_captives.0004.b:0 "Keep one of them"
 halfsade_captives.0004.c:0 "Free one of them"
 halfsade_captives.0004.d:0 "Set them both free"
 halfsade_captives.0004.e:0 "Send them back to their captivity"

 # --- Event 0008 ---
 halfsade_captives.0008.t:0 "Choose a Stranger"
 halfsade_captives.0008.desc:0 "Choose the stranger you wish to take in first. You will decide what to do with the others afterward.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge].\n#bold [halfsade_captive_2.GetFirstName]#! - [halfsade_captive_2.GetCulture.GetName] [halfsade_captive_2.GetWomanMan], age [halfsade_captive_2.GetAge].\n#bold [halfsade_captive_3.GetFirstName]#! - [halfsade_captive_3.GetCulture.GetName] [halfsade_captive_3.GetWomanMan], age [halfsade_captive_3.GetAge]."
 halfsade_captives.0008.a:0 "Take in [halfsade_captive_1.GetFirstName]"
 halfsade_captives.0008.b:0 "Take in [halfsade_captive_2.GetFirstName]"
 halfsade_captives.0008.c:0 "Take in [halfsade_captive_3.GetFirstName]"
 halfsade_captives.0008.d:0 "Consider my other options"

 # --- Event 0009 ---
 halfsade_captives.0009.t:0 "Choose a Stranger"
 halfsade_captives.0009.desc:0 "Choose the stranger you wish to take in. You will decide what to do with the other afterward.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge].\n#bold [halfsade_captive_2.GetFirstName]#! - [halfsade_captive_2.GetCulture.GetName] [halfsade_captive_2.GetWomanMan], age [halfsade_captive_2.GetAge]."
 halfsade_captives.0009.a:0 "Take in [halfsade_captive_1.GetFirstName]"
 halfsade_captives.0009.b:0 "Take in [halfsade_captive_2.GetFirstName]"
 halfsade_captives.0009.c:0 "Consider my other options"

 # --- Event 0010 ---
 halfsade_captives.0010.t:0 "Set a Stranger Free"
 halfsade_captives.0010.desc:0 "Choose the stranger you wish to set free. You will decide what to do with the other afterward.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge].\n#bold [halfsade_captive_2.GetFirstName]#! - [halfsade_captive_2.GetCulture.GetName] [halfsade_captive_2.GetWomanMan], age [halfsade_captive_2.GetAge]."
 halfsade_captives.0010.a:0 "Set [halfsade_captive_1.GetFirstName] free"
 halfsade_captives.0010.b:0 "Set [halfsade_captive_2.GetFirstName] free"
 halfsade_captives.0010.c:0 "Consider my other options"

 # --- Event 0005 ---
 halfsade_captives.0005.t:0 "One Stranger Remains"
 halfsade_captives.0005.desc:0 "One captive still stands before your throne, waiting on your word.\n\n#bold [halfsade_captive_1.GetFirstName]#! - [halfsade_captive_1.GetCulture.GetName] [halfsade_captive_1.GetWomanMan], age [halfsade_captive_1.GetAge]."
 halfsade_captives.0005.a:0 "Welcome [halfsade_captive_1.GetFirstName] to my [court|E]"
 halfsade_captives.0005.b:0 "Send [halfsade_captive_1.GetFirstName] back to their captivity"
 halfsade_captives.0005.c:0 "Set [halfsade_captive_1.GetFirstName] free"

 # --- Event 0007 ---
 halfsade_captives.0007.t:0 "A Stranger Asks to Leave"
 halfsade_captives.0007.desc:0 "A year ago you freed [halfsade_leaver.GetFirstName], a [halfsade_leaver.GetCulture.GetName] [halfsade_leaver.GetWomanMan] taken far from home. Nothing has bound them to your [court|E] since, and they now ask leave to go their own way."
 halfsade_captives.0007.a:0 "Wish them a safe journey"
 halfsade_captives.0007.b:0 "Offer them a purse to stay"

 # --- Modifiers ---
 halfsade_captives_far_from_home_modifier:0 "Far From Home"
 halfsade_captives_far_from_home_modifier_desc:0 "Taken to a land very unlike their own, this person longs for home."
 halfsade_captives_exotic_taste_modifier:0 "Exotic Tastes"
 halfsade_captives_exotic_taste_modifier_desc:0 "Word has spread that this ruler keeps strangers from distant lands at [court|E], and some find it improper."
 halfsade_captives_freed_modifier:0 "Freed Captive"
 halfsade_captives_freed_modifier_desc:0 "Freed from captivity, this person is grateful and well liked, but is free to leave and will do so unless something keeps them here."
 halfsade_captives_fine_lineage_modifier:0 "Exceptional Lineage"
 halfsade_captives_fine_lineage_modifier_desc:0 "Taken for a distinguish features, this person's children are more likely to inherit favorable traits."
 